name: Publish

# Publishes Bulutklinik.Sdk to NuGet on a vX.Y.Z tag.
# Requires the NUGET_API_KEY secret.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Bulutklinik.Sdk.Tests/Bulutklinik.Sdk.Tests.csproj -c Release
      - run: dotnet pack src/Bulutklinik.Sdk/Bulutklinik.Sdk.csproj -c Release -o artifacts
      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
